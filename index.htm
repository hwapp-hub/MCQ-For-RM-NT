[data-mode=dark] .quiz-title{color:var(--accent)}

.question-text{font-size:1.12rem;line-height:1.8;font-weight:700;margin:16px 0}

.option.wrong{border-color:#C62828;background:#FFEBEE;color:#B71C1C}
[data-mode=dark] .option.correct{background:#12351b;color:#a5f3ad}
[data-mode=dark] .option.wrong{background:#3b1212;color:#ffb4b4}
.option-symbol{font-size:1.2rem;font-weight:900;min-width:24px}
.feedback{margin-top:14px;font-weight:800;line-height:1.7;min-height:25px}
.feedback.correct{color:#2E7D32}.feedback.wrong{color:#C62828}
.quiz-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}

inal tract"], "answer": 2}, {"q": "Which treatment combination is administered to rapidly shift extracellular potassium into the intracellular compartment?", "options": ["Insulin with dextrose", "Calcium gluconate with furosemide", "Kayexalate with normal saline", "Spironolactone with potassium chloride"], "answer": 0}, {"q": "Which characteristic ECG abnormality is associated with hypokalemia?", "options": ["Prominent U waves", "Tall, tented T waves", "Widened QRS complex without P wave change", "Shortened PR interval"], "answer": 0}, {"q": "Why is direct intravenous push of Potassium Chloride (KCl) strictly contraindicated?", "options": ["It causes immediate severe hypokalemia", "It leads to severe hypoglycemia", "It causes lethal cardiac arrest (DEATH)", "It induces acute anaphylaxis"], "answer": 2}],

  {q:'What is the normal primary route of excess copper elimination from the body?',options:['Urine','Biliary excretion into feces','Sweat','Exhalations'],answer:1},
  {q:'How is non-ceruloplasmin-bound (free) serum copper level altered in Wilson’s disease?',options:['Decreased','Elevated','Zero','Unchanged'],answer:1},
  {q:'Which screening strategy is recommended for first-degree relatives of a diagnosed patient?',options:['Screening with ceruloplasmin, urine copper, slit-lamp exam, and genetic testing','No screening needed unless symptomatic','Liver biopsy for all relatives immediately','Brain MRI for all relatives'],answer:0},
  {q:'Is treatment for Wilson’s disease temporary or lifelong?',options:['1-month course','6-month course','Lifelong continuous maintenance therapy','Until symptoms resolve only'],answer:2}
 ]
};

let activeModule='nt', currentQuiz=null, currentIndex=0, score=0, answered=false;
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setTheme(name){if(name==='burgundy')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',name);localStorage.setItem('app_color_theme',name);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(name)));}
function toggleMode(){const dark=document.documentElement.getAttribute('data-mode')==='dark';if(dark){document.documentElement.removeAttribute('data-mode');document.getElementById('modeBtn').textContent='☀️ فاتح';localStorage.setItem('app_mode','light')}else{document.documentElement.setAttribute('data-mode','dark');document.getElementById('modeBtn').textContent='🌙 غامق';localStorage.setItem('app_mode','dark')}}
setTheme(localStorage.getItem('app_color_theme')||'burgundy');if(localStorage.getItem('app_mode')==='dark'){document.documentElement.setAttribute('data-mode','dark');document.getElementById('modeBtn').textContent='🌙 غامق'}
function renderNav(){const nav=document.getElementById('modulesNav');nav.innerHTML='';Object.keys(defaultModules).forEach(key=>{const m=defaultModules[key],b=document.createElement('button');b.className='module-tab '+(key===activeModule?'active':'');b.innerHTML=`${m.icon} ${escapeHTML(m.title)}`;b.onclick=()=>{activeModule=key;renderNav();renderModules()};nav.appendChild(b)})}
function renderModules(){const root=document.getElementById('modulesContainer');root.innerHTML='';const mod=defaultModules[activeModule];const title=document.createElement('h2');title.className='section-title';title.textContent=mod.icon+' '+mod.title;root.appendChild(title);
 mod.sections.forEach(sec=>{const sh=document.createElement('h3');sh.className='section-title';sh.textContent=sec.name;root.appendChild(sh);const grid=document.createElement('div');grid.className='subjects-grid';
 sec.subjects.forEach(sub=>{const card=document.createElement('section');card.className='subject-card';const head=document.createElement('div');head.className='subject-header';head.innerHTML=`<div class="subject-title">${escapeHTML(sub.name)}</div><span>📚 ${sub.lectures.length} محاضرات</span>`;card.appendChild(head);const list=document.createElement('div');list.className='lectures-list';
 sub.lectures.forEach((lec,i)=>{const key=`${sub.id}_${i}`,has=!!quizzes[key];const row=document.createElement('div');row.className='lecture-row';row.innerHTML=`<span class="lecture-name">${escapeHTML(lec)}</span><button class="btn lecture-open ${has?'':'secondary'}" ${has?'':'disabled'}>${has?'ابدأ الامتحان 📝':'الأسئلة قريباً'}</button>`;const btn=row.querySelector('button');if(has)btn.onclick=()=>startQuiz(key,lec);list.appendChild(row)});card.appendChild(list);grid.appendChild(card)});root.appendChild(grid)})
}
function startQuiz(key,title){currentQuiz={key,title,questions:quizzes[key]};currentIndex=0;score=0;answered=false;document.getElementById('libraryView').hidden=true;document.getElementById('quizView').hidden=false;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function renderQuestion(){const host=document.getElementById('quizView'),q=currentQuiz.questions[currentIndex];answered=false;host.innerHTML=`<div class="quiz-card"><div class="quiz-top"><div class="quiz-title">${escapeHTML(currentQuiz.title)}</div><div class="quiz-meta">السؤال ${currentIndex+1} من ${currentQuiz.questions.length}</div></div><div class="quiz-progress"><div class="quiz-progress-fill" style="width:${currentIndex/currentQuiz.questions.length*100}%"></div></div><div class="question-text">${currentIndex+1}. ${escapeHTML(q.q)}</div><div class="options">${q.options.map((o,i)=>`<button class="option" data-option="${i}"><span class="option-symbol">${['A','B','C','D'][i]}.</span><span>${escapeHTML(o)}</span><span class="option-symbol" aria-hidden="true"></span></button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="quiz-actions"><button class="btn secondary" onclick="backToLibrary()">رجوع للمحاضرات</button><button class="btn" id="nextBtn" disabled>${currentIndex===currentQuiz.questions.length-1?'عرض النتيجة':'السؤال التالي ←'}</button></div></div>`;
 host.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>chooseAnswer(Number(b.dataset.option))));document.getElementById('nextBtn').onclick=nextQuestion}
function chooseAnswer(choice){if(answered)return;answered=true;const q=currentQuiz.questions[currentIndex];const buttons=document.querySelectorAll('.option');buttons.forEach((b,i)=>{b.disabled=true;const sym=b.querySelectorAll('.option-symbol')[1];if(i===q.answer){b.classList.add('correct');sym.textContent='✓'}if(i===choice&&i!==q.answer){b.classList.add('wrong');sym.textContent='✕'}});const fb=document.getElementById('feedback');if(choice===q.answer){score++;fb.className='feedback correct';fb.textContent='إجابة صحيحة! ✓'}else{fb.className='feedback wrong';fb.textContent='إجابة خاطئة ✕ — الإجابة الصحيحة: '+q.options[q.answer]}document.getElementById('nextBtn').disabled=false}
function nextQuestion(){if(!answered)return;if(currentIndex<currentQuiz.questions.length-1){currentIndex++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}else showResult()}
function showResult(){const total=currentQuiz.questions.length,pct=Math.round(score/total*100);document.getElementById('quizView').innerHTML=`<div class="quiz-card"><div class="quiz-title" style="text-align:center">${escapeHTML(currentQuiz.title)}</div><div class="result-score">${score} / ${total}</div><div class="result-message">درجتك ${pct}% ${pct>=80?'ممتاز! 🌟':pct>=60?'جيد، استمر بالمراجعة 💪':'راجع المحاضرة وحاول مرة ثانية 📚'}</div><div class="quiz-actions" style="justify-content:center"><button class="btn secondary" onclick="startQuiz(currentQuiz.key,currentQuiz.title)">إعادة الامتحان 🔁</button><button class="btn" onclick="backToLibrary()">قائمة المحاضرات</button></div></div>`}
function backToLibrary(){document.getElementById('quizView').hidden=true;document.getElementById('libraryView').hidden=false;currentQuiz=null;window.scrollTo({top:0,behavior:'smooth'})}
renderNav();renderModules();
</script>
</body>
</html>
