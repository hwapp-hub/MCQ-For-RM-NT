 'rm_theory_0': [{"q":"What is Biostatistics?","options":["The study of human anatomy","Application of statistical methods to biological and medical problems","The study of medications only","The study of microorganisms"],"answer":1},{"q":"Biostatistics is considered the language of:","options":["Evidence-based medicine","Anatomy","Surgery","Pharmacology"],"answer":0},{"q":"Which of the following is NOT a main task of biostatistics?","options":["Descriptive statistics","Inferential statistics","Hypothesis testing","Surgical intervention"],"answer":3},{"q":"The entire group of individuals we are interested in studying is called:","options":["Sample","Variable","Population","Data"],"answer":2},{"q":"A subset of a population selected for study is called:","options":["Parameter","Sample","Variable","Hypothesis"],"answer":1},{"q":"Which of the following is a quantitative variable?","options":["Blood group","Gender","Nationality","Blood pressure"],"answer":3},{"q":"Blood groups (A, B, AB, O) are classified as:","options":["Nominal data","Ordinal data","Discrete data","Continuous data"],"answer":0},{"q":"Cancer stages (I, II, III, IV) are examples of:","options":["Nominal data","Continuous data","Ordinal data","Discrete data"],"answer":2},{"q":"Number of hospital visits is an example of:","options":["Continuous data","Discrete data","Nominal data","Ordinal data"],"answer":1},{"q":"Which measure of central tendency is most sensitive to outliers?","options":["Median","Mode","Mean","IQR"],"answer":2},{"q":"The middle value when data are arranged in order is called:","options":["Mean","Median","Mode","Range"],"answer":1},{"q":"The most frequently occurring value is called:","options":["Mean","Median","Range","Mode"],"answer":3},{"q":"Range is calculated by:","options":["Highest value − Lowest value","Mean − Median","Sum of values ÷ Number of values","Highest value + Lowest value"],"answer":0},{"q":"The Interquartile Range (IQR) represents:","options":["The highest 25% of data"  'rm_theory_1': [{"q":"What is the main purpose of presenting data mathematically?","options":["To increase the number of observations","To simplify complex data and reveal patterns","To eliminate numerical variables","To replace clinical research"],"answer":1},{"q":"Which of the following is an example of a nominal variable?","options":["Disease severity","Blood type","Body temperature","Patient height"],"answer":1},{"q":"Which type of variable has categories with a clear order?","options":["Nominal","Discrete","Ordinal","Continuous"],"answer":2},{"q":"Which of the following is a discrete numerical variable?","options":["Patient height","Blood pressure","Body temperature","Number of hospital admissions"],"answer":3},{"q":"Which measure of central tendency represents the average value?","options":["Mean","Median","Mode","Range"],"answer":0},{"q":"What is the main disadvantage of the mean?","options":["It does not include all observations","It is affected by extreme values","It cannot be calculated mathematically","It is not a single value"],"answer":1},{"q":"When can we calculate the overall mean by simply averaging the means of different classes?","options":["When all means are different","When sample sizes are different","When sample sizes are identical","When all classes have the same highest score"],"answer":2},{"q":"For an even number of observations, the median is calculated by:","options":["Selecting the highest value","Selecting the most frequent value","Dividing the sum by the number of observations","Calculating the mean of the two middle values"],"answer":3},{"q":"Which measure of central tendency is unaffected by extreme values?","options":["Median","Mean","Weighted mean","Standard deviation"],"answer":0},{"q":"Which measure is most appropriate for nominal data?","options":["Mean","Mode","Median","Standard deviation"],"answer":1},{"q":"A distribution with two modes is called:","options":["Unimodal","Multimodal","Bimodal","Nonmodal"],"answer":2},{"q":"What does the range measure?","options":["The middle 50% of observations","The average squared deviation","The square root of variance","The difference between the highest and lowest values"],"answer":3},{"q":"Which statement about variance is correct?","options":["It can never be negative","It is always expressed in the original unit","It ignores observations in the center","It is the square root of the mean"],"answer":0},{"q":"Standard deviation is equal to:","options":["Mean divided by variance","Square root of variance","Variance multiplied by mean","Highest value minus lowest value"],"answer":1},{"q":"Which formula represents the Standard Error (SE)?","options":["SE = SD × n","SE = Mean / SD","SE = SD / √n","SE = SD × √n"],"answer":2},{"q":"The coefficient of variation (CV) is calculated by:","options":["Mean × SD","SD + Mean","Mean / SD × 100","(SD / Mean) × 100"],"answer":3},{"q":"Which measure is useful for comparing dispersion between datasets with different units?","options":["Coefficient of variation","Range","Variance","Median"],"answer":0},{"q":"The first quartile (Q1) represents which percentile?","options":["50th percentile","25th percentile","75th percentile","100th percentile"],"answer":1},{"q":"The second quartile (Q2) is equal to:","options":["25th percentile","75th percentile","50th percentile","90th percentile"],"answer":2},{"q":"In a positively skewed distribution, the tail extends to the:","options":["Left","Center","Both sides equally","Right"],"answer":3},{"q":"A normal distribution is also known as:","options":["Bell-shaped curve","Skewed curve","Bimodal curve","Flat curve"],"answer":0},{"q":"Which graph is most suitable for categorical data?","options":["Histogram","Bar chart","Line graph","Box plot"],"answer":1},{"q":"Which graphical presentation is used for continuous data distribution?","options":["Pie chart","Bar chart","Histogram","Line graph"],"answer":2},{"q":"Which graph displays median, quartiles, and outliers?","options":["Bar chart","Pie chart","Line graph","Box plot"],"answer":3},{"q":"Which graphical presentation is most appropriate for showing trends over time?","options":["Line graph","Pie chart","Histogram","Box plot"],"answer":0}],

ts moving upward and to the right indicate:","options":["Positive correlation","Negative correlation","No correlation","Skewed distribution"],"answer":0},{"q":"Points moving downward indicate:","options":["Positive correlation","Negative correlation","Normal distribution","No variation"],"answer":1},{"q":"Which graph is excellent for comparing numerical distributions across multiple ordinal categories?","options":["Pie chart","Histogram","Box plot","Line graph"],"answer":2},{"q":"In a box plot, the box represents:","options":["The lowest 25%","The highest 75%","The entire range","The middle 50% of data"],"answer":3},{"q":"The line inside a box plot represents:","options":["Median","Mean","Mode","Range"],"answer":0},{"q":"Individual points outside the whiskers are called:","options":["Medians","Outliers","Means","Categories"],"answer":1},{"q":"Line graphs are ideal for showing:","options":["Proportions of a whole","Categorical frequencies","Changes over sequential intervals","Outliers"],"answer":2},{"q":"Which graph is appropriate for tracking weight loss over 6 months?","options":["Pie chart","Histogram","Scatter plot","Line graph"],"answer":3},{"q":"Which graph is best for showing the number of patients by diagnosis?","options":["Bar chart","Histogram","Box plot","Scatter plot"],"answer":0},{"q":"Which is an essential element of a good graph?","options":["Excessive colors","Clear title and axis labels","3D effects","Unnecessary decorations"],"answer":1},{"q":"Why should misleading scales be avoided?","options":["To increase sample size","To improve colors","To avoid distorting data interpretation","To increase variables"],"answer":2},{"q":"In a hypertension audit involving systolic BP readings from 200 patients, which graph is recommended?","options":["Pie chart","Scatter plot","Line graph","Histogram"],"answer":3},{"q":"In diabetes management, HbA1c levels are measured over 12 months. Which graph is most appropriate?","options":["Line graph","Bar chart","Pie chart  'rm_theory_3': [{"q":"Which of the following best defines the \"Study Population\"?","options":["The entire group of individuals sharing a common feature globally","The subset of the target population that is accessible to the researcher","A small group chosen strictly by random selection","The list of numerical values obtained after completing the study"],"answer":1},{"q":"What is \"Statistical Inference\"?","options":["Collecting data from every single member of a population","Dividing the population into equal subgroups","The process of using sample data to make conclusions about a larger population","Selecting participants based on their willingness to participate"],"answer":2},{"q":"Sampling is unnecessary in which of the following scenarios?","options":["When critical high-risk quality control requires inspecting every single component","When detailed, in-depth information is needed from a few subjects","When the target population is extremely large and spread out","When time and financial budget are limited"],"answer":0},{"q":"What is the fundamental characteristic of Probability Sampling?","options":["Selection is based on the researcher’s judgment","Participants recruit other participants","It relies entirely on convenience and availability","Each population member has a known, non-zero chance of selection"],"answer":3},{"q":"A researcher has a complete list of 1,000 medical students and uses a random number generator to pick 100 students. This is an example of:","options":["Simple Random Sampling","Systematic Sampling","Stratified Sampling","Cluster Sampling"],"answer":0},{"q":"Choosing every nth person from a regular list after selecting a random starting point describes:","options":["Convenience Sampling","Quota Sampling","Purposive Sampling","Systematic Sampling"],"answer":3},{"q":"In Stratified Sampling, how is the sample selected?","options":["The population is divided into groups (strata), and random samples are taken from EVERY group","Entire natural groups are selected at random while others are left out completely","Subjects are picked based on referral chains","Every 10th subject is chosen from a master list"],"answer":0},{"q":"What is the \"Golden Rule\" that distinguishes Stratified Sampling from Cluster Sampling?","options":["Stratified uses non-random selection; Cluster uses random selection","Stratified selects SOME people from EVERY group; Cluster selects WHOLE groups from SOME groups","Stratified is faster; Cluster is more expensive","Stratified requires referrals; Cluster requires a fixed interval"],"answer":1},{"q":"A study divides a province into 50 districts, randomly selects 5 districts, and studies ALL individuals within those 5 districts. This is:","options":["Stratified Random Sampling","Cluster Sampling","Systematic Sampling","Quota Sampling"],"answer":1},{"q":"Which of the following is a key advantage of Non-Probability Sampling compared to Probability Sampling?","options":["It allows strong statistical generalization to the whole population","It eliminates selection bias completely","It is usually faster, cheaper, and practical when no sampling frame exists","Every member has an equal chance of being selected"],"answer":2},{"q":"Surveying students who happen to be sitting in the college cafeteria right now is an example of:","options":["Convenience Sampling","Purposive Sampling","Simple Random Sampling","Cluster Sampling"],"answer":0},{"q":"A researcher deliberately chooses experienced department heads to interview about hospital policy. This technique is:","options":["Snowball Sampling","Quota Sampling","Purposive (Judgmental) Sampling","Systematic Sampling"],"answer":2},{"q":"A study requires 60 male and 40 female participants. The researcher interviews people non-randomly until these target numbers are filled. This is:","options":["Stratified Random Sampling","Simple Random Sampling","Cluster Sampling","Quota Sampling"],"answer":3},{"q":"Snowball sampling is MOST useful for studying which type of population?","options":["Large, well-documented public registry populations","Hard-to-reach, hidden, or rare populations","Strictly organized groups like hospital employees","Populations where complete 100% census is required by law"],"answer":1},{"q":"What memory acronym/trick is used for the four Non-Probability sampling techniques?","options":["S-S-S-C","C-P-Q-S (Convenience, Purposive, Quota, Snowball)","P-N-P-S","R-A-N-D"],"answer":1},{"q":"Which of the following is a primary reason for conducting sampling instead of a census?","options":["Sampling always guarantees zero error","Reduced cost and faster data collection","It allows inspecting 100% of high-risk systems","Laws always mandate sampling over full inspection"],"answer":1},{"q":"\"Population of observations\" refers to:","options":["The physical entities like patients or animals","The group of numerical values/quantifiable measurements of the characteristics","The geographic location of the university","The list of excluded subjects"],"answer":1},{"q":"If a company has 80% female and 20% male staff, and a sample of 100 is chosen matching this ratio (80 females, 20 males) randomly, this ensures:","options":["Representation matching the population structure","Snowball effect","Complete non-probability bias","Convenience sampling"],"answer":0},{"q":"When a research question asks for \"every 15th patient starting from patient #7\", the interval k is:","options":["Random start","Sampling interval in systematic sampling","Stratum quota","Cluster size"],"answer":1},{"q":"Which sampling method carries the highest risk of selection bias and limited generalizability?","options":["Simple Random Sampling","Stratified Random Sampling","Systematic Random Sampling","Convenience Sampling"],"answer":3},{"q":"(MCQ 1 from Slide) Which statement BEST distinguishes the study population from the general population?","options":["The study population consists only of people who have already been sampled.","The study population is the portion of the population that is accessible to the researcher.","The study population always has exactly the same characteristics as the sample.","The study population refers only to numerical observations."],"answer":1},{"q":"(MCQ 3 from Slide) A researcher wants to study 1,000 hospital employees divided into doctors, nurses, technicians, and administrative staff, and randomly selects participants from EACH category. What is this?","options":["Cluster sampling","Quota sampling","Stratified random sampling","Systematic sampling"],"answer":2},{"q":"(MCQ 4 from Slide) A researcher randomly chooses 8 hospitals from a list of 80 hospitals and surveys ALL employees within those selected hospitals. Which technique is MOST appropriate?","options":["Stratified sampling","Purposive sampling","Systematic sampling","Cluster sampling"],"answer":3},{"q":"(MCQ 5 from Slide) A researcher chooses a random starting point on a patient list and then selects every 15th patient. Which feature is ESSENTIAL to this method?","options":["Selecting participants at a predetermined interval","Selecting participants who are easiest to contact","Dividing the population into homogeneous groups","Asking participants to recruit other participants"],"answer":0},{"q":"(MCQ 8 from Slide) A researcher needs 60 males and 40 females. Participants are recruited until these numbers are reached, but participants within each group are NOT randomly selected. What type of sampling is this?","options":["Quota sampling","Stratified random sampling","Cluster sampling","Simple random sampling"],"answer":0}],
 'rm_theory_4': [{"q":"What is the fundamental definition of probability in medical research?","options":["The exact number of patients cured in a clinical trial","A numerical measure of how likely an event is to occur","The total number of non-mutually exclusive outcomes","A subjective opinion formed only by senior physicians"],"answer":1},{"q":"A probability value of 0 (or 0%) indicates that an event is:","options":["Certain to occur","Equally likely to happen or not","Impossible to occur","Highly probable based on historical data"],"answer":2},{"q":"If a drug successfully cures 80 out of 100 patients in a clinical trial, this calculation represents which type of probability?","options":["Theoretical Probability","Empirical (Frequentist) Probability","Subjective Probability","Conditional Bayes Probability"],"answer":1},{"q":"In probability terminology, what is defined as \"the set of all possible outcomes of an experiment\"?","options":["Event","Experiment","Sample Space","Conditional outcome"],"answer":2},{"q":"When rolling a fair six-sided die, rolling an even number {2, 4, 6} is considered a(n):","options":["Sample Space","Event","Subjective estimate","Experiment"],"answer":1},{"q":"Which rule of probability is used to calculate the probability of either event A or event B occurring when the events are mutually exclusive?","options":["Addition Rule: P(A or B) = P(A) + P(B)","Multiplication Rule: P(A and B) = P(A) × P(B)","Bayes' Theorem","Conditional Rule: P(A/B) = P(A) / P(B)"],"answer":0},{"q":"If a diagnostic test has a 95% chance of being positive in a diseased person, what is the probability that it tests positive for two independent patients with the disease?","options":["0.95 + 0.95 = 1.90","0.95 / 2 = 0.475","0.95 - 0.05 = 0.90","0.95 × 0.95 = 0.9025"],"answer":3},{"q":"Conditional probability P(A/B) is correctly read and interpreted as:","options":["The probability of A plus B","The probability of A given that B has already occurred","The probability of A minus the probability of B","The probability of B given that A has already occurred"],"answer":1},{"q":"In clinical diagnostic testing, P(Positive Test / Disease) represents the:","options":["Specificity","Sensitivity","Positive Predictive Value (PPV)","Negative Predictive Value (NPV)"],"answer":1},{"q":"What role does Bayes' Theorem play in diagnostic reasoning and clinical practice?","options":["It proves causality between independent clinical variables","It calculates sample spaces for non-random experiments","It updates the probability of a disease after receiving new test results","It eliminates the need for calculating pre-test probability"],"answer":2},{"q":"The term P(Disease) in Bayes' Theorem formula corresponds to:","options":["The prior probability (prevalence) of the disease in the population","The false positive rate of the diagnostic test","The Negative Predictive Value (NPV)","The sensitivity minus specificity"],"answer":0},{"q":"What clinical probability metric is defined as P(Disease / Positive Test)?","options":["Sensitivity","Specificity","Negative Predictive Value (NPV)","Positive Predictive Value (PPV)"],"answer":3},{"q":"Specificity in diagnostic testing refers to the probability that a test correctly:","options":["Identifies the presence of the disease in sick patients","Identifies the absence of the disease in healthy individuals","Predicts a false positive outcome","Replaces the need for Bayes' Theorem"],"answer":1},{"q":"What is the Negative Predictive Value (NPV) formula in diagnostic testing?","options":["P(No Disease / Negative Test)","P(Disease / Negative Test)","P(Negative Test / No Disease)","P(Negative Test / Disease)"],"answer":0},{"q":"An experienced physician estimates a patient's likelihood of appendicitis based on clinical judgment and personal past experience. This is an example of:","options":["Classical Probability","Empirical Probability","Subjective Probability","Frequentist Probability"],"answer":2},{"q":"Believing that past independent outcomes influence future outcomes (e.g., expecting a coin to land on tails because it landed on heads five times in a row) is known as:","options":["Base Rate Neglect","Gambler's Fallacy","Correlation Fallacy","Subjective Bias"],"answer":1},{"q":"Ignoring the underlying population prevalence when interpreting a diagnostic test result is a misconception called:","options":["Base Rate Neglect","Gambler's Fallacy","False Positive Fallacy","Conditional Probability Error"],"answer":0},{"q":"Which of the following statements regarding probability concepts is TRUE?","options":["High correlation between two variables proves a direct causal relationship","Probability is expressed as a number between -1 and +1","A probability of 0.5 means the event is equally likely to happen or not happen","Mutually exclusive events can happen simultaneously"],"answer":2},{"q":"In probability theory, an \"Experiment\" is defined as:","options":["A medical procedure performed only in laboratory trials","A process that leads to an outcome","A subset of the sample space","A measure of diagnostic test accuracy"],"answer":1},{"q":"When calculating the probability of a patient having either Type A blood (P=0.4) or Type B blood (P=0.1), the result is 0.5. This is an application of:","options":["The Multiplication Rule for independent events","The Addition Rule for mutually exclusive events","Subjective Probability estimation","Bayes' Theorem for prior updating"],"answer":1},{"q":"Theoretical (Classical) probability is based on:","options":["Long-term observational data from clinical trials","Expert opinion and historical physician experience","Mathematical reasoning and known logic about a situation","Post-test clinical updates"],"answer":2},{"q":"Calculating the 10-year probability of a cardiovascular event in diabetic patients is an example of probability applied to:","options":["Subjective physician estimation","Risk Assessment in cohort studies","Base Rate Neglect calculation","Gambler's Fallacy evaluation"],"answer":1},{"q":"If an event has a probability of 0.05 (or 5%), this means:","options":["The event is completely impossible","The event is certain to occur in 5 trials","The event has a 5% chance of happening","The event has a 95% chance of happening"],"answer":2},{"q":"In the denominator of Bayes' Theorem formula, P(Positive Test) represents:","options":["Only true positive test results","Only false positive test results","Overall probability of a positive test, accounting for both true and false positives","The overall prevalence of the disease in the population"],"answer":2},{"q":"Which of the following is NOT one of the main applications of probability mentioned in clinical decision-making?","options":["Assessing risk","Interpreting test results","Understanding likelihood of treatment outcomes","Guaranteeing 100% diagnostic accuracy in every patient"],"answer":3}],'rm_theory_5': [{"q": "What is the definition of a probability distribution?", "options": ["A calculation of sample sizes in clinical research", "A description of how probabilities are assigned to different outcomes of a random variable", "A method to measure the exact average of categorical variables", "A system used exclusively for continuous outcome variables"], "answer": 1}, {"q": "Which of the following best describes a continuous random variable?", "options": ["It can take any value within a given range", "It takes specific, countable values only", "It is always represented by a fixed integer", "It only measures discrete binary outcomes"], "answer": 0}, {"q": "Which parameter represents the mean in a Normal Distribution?", "options": ["σ²", "λ", "n", "μ"], "answer": 3}, {"q": "According to the Empirical Rule (68-95-99.7 Rule), what percentage of data falls within one standard deviation of the mean in a normal distribution?", "options": ["Approximately 95%", "Approximately 99.7%", "Approximately 68%", "Approximately 50%"], "answer": 2}, {"q": "Student's t-Distr  'rm_theory_6': [{"q":"What is the definition of statistical inference?","options":["Collecting data from every single individual in a population","The process of using sample information to make conclusions about a population","Calculating the standard deviation of individual observations","Plotting frequency distribution curves for descriptive presentation"],"answer":1},{"q":"Which of the following is an example of a population parameter?","options":["Sample mean (X̄)","Sample standard deviation (s)","Population mean (μ)","Sample proportion (p)"],"answer":2},{"q":"A researcher measures the blood pressure of 100 adults and finds a mean of 128 mmHg. The value 128 mmHg is a:","options":["Population parameter","Point estimate","Population standard deviation","Standard error"],"answer":1},{"q":"What are the two main approaches to statistical inference?","options":["Point estimation and interval estimation","Sample size calculation and standard deviation","Hypothesis testing and estimation","Data collection and descriptive graphing"],"answer":2},{"q":"Which symbol represents the point estimate of the population mean (μ)?","options":["s","P","X̄","σ"],"answer":2},{"q":"Why is the sample mean (X̄) considered the best point estimate for the population mean (μ)?","options":["Because it is an unbiased estimator","Because it always equals the standard deviation","Because it completely eliminates sampling variation","Because it is calculated using n-1 degrees of freedom"],"answer":0},{"q":"Why do we divide by n-1 instead of n when calculating the sample standard deviation (s)?","options":["To increase the value of the sample mean","To correct for using the sample mean instead of the population mean, making s² an unbiased estimator","To reduce the confidence level from 95% to 90%","To ensure the total area under the normal curve equals 1"],"answer":1},{"q":"If a sample contains the values 2, 4, 6, and 8, what is the calculated sample standard deviation (s)?","options":["2.00"," hat is the 95% Confidence Interval for the population mean?","options":["76.08 – 83.92","78.00 – 82.00","74.12 – 85.88","80.00 – 83.92"],"answer":0},{"q":"What effect does increasing the sample size (n) have on Standard Error and Confidence Interval width?","options":["SE increases and CI becomes wider","SE decreases and CI becomes narrower","SE increases and CI becomes narrower","SE and CI remain unchanged"],"answer":1},{"q":"How does increasing the confidence level (e.g., from 90% to 99%) affect the width of a Confidence Interval?","options":["It makes the interval narrower","It has no effect on the width","It makes the interval wider","It reduces the sample standard deviation"],"answer":2},{"q":"A confidence interval is mathematically calculated as:","options":["Mean ± Standard Deviation","Mean ± Sample Size","Mean ± Variance","Mean ± Margin of Error"],"answer":3},{"q":"Which term describes 'the probability or likelihood that a specified interval will contain the true population parameter'?","options":["Standard error","Confidence level","Degrees of freedom","Sampling variability"],"answer":1},{"q":"What does a smaller Standard Error indicate about an estimate?","options":["The estimate has lower statistical power","The sample size was too small","The estimate is more precise","The population parameter is zero"],"answer":2},{"q":"The total area under a standard normal distribution curve equals:","options":["0.50","0.95","0.99","1.00 (or 100%)"],"answer":3},{"q":"Inferring or estimating population average using data from a single sample is known as:","options":["One population mean","Population standard deviation","Empirical distribution","Bivariate correlation"],"answer":0}],
 'rm_theory_7': [{"q":"What is the primary purpose of Inferential Biostatistics?","options":["To organize and present sample data using graphs","To test specific hypotheses about a population based on sample evidence","To calculate only the mean body weight of a population","To eliminate sample variability entirely"],"answer":1},{"q":"The variation observed between means of different samples drawn from the same population is due to:","options":["Sampling variability","Calculation errors","Rejecting the alternative hypothesis","Incorrect data measurement"],"answer":0},{"q":"Which statistical measure represents a population parameter?","options":["Sample mean (X̄)","Standard deviation (S.D)","Population mean (μ)","Sample estimate"],"answer":2},{"q":"The Null Hypothesis (H0) is defined as a statement of:","options":["Significant difference between groups","Strong positive correlation","Predictive clinical superiority","No difference or no effect of the influencing factor"],"answer":3},{"q":"Which of the following tests is used for discrete variables (categorical data)?","options":["Chi-Square (χ²) test","Student's t-test","One-way ANOVA (F test)","Linear Regression"],"answer":0},{"q":"If a researcher wants to compare the means of two independent groups with one continuous variable, which test should be applied?","options":["Chi-Square test","t-test","ANOVA (F test)","Correlation test"],"answer":1},{"q":"When comparing more than two groups with one continuous variable, the appropriate test of significance is:","options":["Chi-Square test","Paired t-test","F-test (ANOVA)","Regression analysis"],"answer":2},{"q":"What does the level of significance (α) represent?","options":["The probability of rejecting a true Null Hypothesis (H0)","The probability of accepting a false Null Hypothesis","The sample standard deviation divided by sample size","The total area under the acceptance region"],"answer":0},{"q":"In biological and medical research, the standard level of significance (α) set for chance effect is typically:","options":["1% (0.01)","5% (0.05)","10% (0.10)","95% (0.95)"],"answer":1},{"q":"When the calculated P-value is smaller than 0.05 (P < 0.05), the decision is to:","options":["Accept H0 and conclude no significant difference","Reject H0 and conclude a significant difference exists","Reject the Alternative Hypothesis (HA)","Increase the sample size without making a decision"],"answer":1},{"q":"If the P-value is greater than 0.05 (P > 0.05), this indicates that:","options":["The influencing factor accounts for more than 95% of the effect","The chance factor accounts for more than 5% of the variation","The Null Hypothesis (H0) must be rejected","A statistical error occurred during analysis"],"answer":1},{"q":"Which of the following is an assumption required before conducting parametric significance tests?","options":["Non-random sampling","Normality of population distribution","Unequal sample variances","Discrete nature of all variables"],"answer":1},{"q":"A test statistic value that falls into the rejection region is said to be:","options":["Statistically non-significant","Equal to the population mean","Statistically significant","Caused purely by sampling error"],"answer":2},{"q":"To assess the relationship between two continuous variables at the same time, we use:","options":["2 × 2 Chi-Square","Independent t-test","ANOVA","Correlation and Regression"],"answer":3},{"q":"If the Null Hypothesis (H0) is rejected, the researcher's clinical decision aligns with:","options":["The Alternative Hypothesis (HA)","The chance factor hypothesis","The baseline sample mean","The non-significant region"],"answer":0},{"q":"Differences observed between two sample groups can be attributed to either an influencing factor or:","options":["Population parameter","Chance factor","Degree of freedom","Type of chart used"],"answer":1},{"q":"Values of the test statistic that are MORE likely to occur if H0 is true will fall into the:","options":["Rejection region","Critical region","Acceptance region","Alpha area"],"answer":2},{"q":"What divides the total area under the curve of a test statistic distribution into rejection and acceptance regions?","options":["The standard error","The sample size","The desired level of significance (α)","The mean of the universe"],"answer":2},{"q":"When the Null Hypothesis is NOT rejected, it implies that the sample data:","options":["Proves H0 is 100% true","Does not provide sufficient evidence to cause rejection of H0","Fully supports the Alternative Hypothesis (HA)","Demonstrates a major effect of the influencing factor"],"answer":1},{"q":"A statement such as \"Drug A is better than Drug B\" is an example of a:","options":["Sample statistic","Hypothesis","Standard error","Frequency distribution"],"answer":1},{"q":"Describing a sample using (Mean ± S.D) falls under which branch of biostatistics?","options":["Inferential Biostatistics","Descriptive Biostatistics","Mathematical Modeling","Regression Analysis"],"answer":1},{"q":"In a normal distribution curve with a 95% confidence level, the chance factor probability is split into:","options":["5% on one side only","2.5% on each side","10% total area","1% on each side"],"answer":1},{"q":"Which test is used to analyze a continuous variable in paired/matched samples (e.g., before and after treatment)?","options":["Two independent samples t-test","Chi-Square a × b","Dependent (paired) sample t-test","F-test ANOVA"],"answer":2},{"q":"The actual key decision-maker used to accept or reject the Null Hypothesis is the:","options":["Sample size (n)","Magnitude of the test statistic","Population standard deviation (σ)","Descriptive table"],"answer":1},{"q":"If P > 0.05, the effect of the influencing factor under study is considered:","options":["Statistically significant","Not statistically significant","Completely absent","Equal to 95%"],"answer":1}],
 'rm_theory_8': [{"q":"Who discovered the t distributions in 1908 under the pseudonym \"Student\"?","options":["Karl Pearson","William S. Gosset","Ronald Fisher","Waqar Al-Kubaisy"],"answer":1},{"q":"Which statistical test is used when comparing the means of more than two groups?","options":["One-sample t test","Paired t test","ANOVA test","Chi Square test"],"answer":2},{"q":"The t-test is classified as a parametric test, which means it assumes that the population data are:","options":["Normally distributed","Discrete and categorical","Non-linearly related","Skewed to the left"],"answer":0},{"q":"If data do not meet the assumptions of a parametric t-test, which non-parametric alternative can be used?","options":["Chi Square test","Regression analysis","Wilcoxon Signed-Rank test","Two-sample t test"],"answer":2},{"q":"How many key data values are required to calculate a t-test?","options":["Two","Three","Four","Five"],"answer":1},{"q":"Which type of t-test should be used when comparing a single sample group against a standard or known population mean value?","options":["Two-sample t test","One-sample t test","Paired t test","ANOVA test"],"answer":1},{"q":"If a study aims to compare the mean blood pressure of individuals before and after a treatment within a single population, which test is appropriate?","options":["Independent two-sample t test","Chi Square test","Paired t test","ANOVA test"],"answer":2},{"q":"When testing whether a difference exists between two populations in a specific direction (greater than or less than), you should use a:","options":["Two-tailed t test","One-tailed t test","Two-sample pooled test","Chi Square test"],"answer":1},{"q":"What is the standard significance threshold commonly selected for the P value in medical hypothesis testing?","options":["0.01","0.05","0.10","0.50"],"answer":1},{"q":"What conclusion is drawn when the calculated test P value is less than the significance threshold (e.g., P < 0.05)?","options":["Reject the null hypo wo independent populations","It does not require continuous data"],"answer":1},{"q":"In a paired t-test, what variable (d) is created for calculation?","options":["The product of values before and after intervention","The difference between values before and after intervention for each individual","The sum of standard errors across two separate groups","The ratio of the population mean to the sample mean"],"answer":1},{"q":"What are the degrees of freedom (d.F) for a paired t-test with N pairs of observations?","options":["N - 1","N - 2","2N - 1","2N - 2"],"answer":0},{"q":"In the study measuring body weight before and after Zinc Sulphate treatment in 5 geriatric patients (N=5), what was the tabulated critical t-value at α = 0.05 (two-tailed, d.F=4)?","options":["1.45","2.065","2.77","4.46"],"answer":2},{"q":"In the Zinc Sulphate geriatric weight study, the calculated t-value was 1.45 while the tabulated t-value was 2.77. What decision was made?","options":["Reject H_0 and accept H_A","Accept H_0 (fail to reject)","Reject both H_0 and H_A","Conclude that Zinc Sulphate significantly changes weight"],"answer":1},{"q":"If the calculated t-value falls into the acceptance region (P > 0.05), what happens to the effect of the chance factor versus the influencing factor?","options":["The chance factor increases (more than 5%)","The influencing factor increases (more than 95%)","The chance factor drops to 0%","The influencing factor remains at 100%"],"answer":0},{"q":"What general formula represents the basic structure of a t-statistic?","options":["t = Mean Difference / Standard Error (SE)","t = Standard Error / Standard Deviation","t = Variance / Degrees of Freedom","t = Sample Size / Standard Deviation"],"answer":0},{"q":"In the acute leukemia study with 20 children (N=20, sample mean Hb=8.5, population mean Hb=13.5), what was the conclusion based on the calculated t = 4.46?","options":["Leukemia has no significant effect on Hb levels (P > 0.05)","There is a significant difference in Hb levels due to leukemia (P < 0.05)","The difference in Hb levels is entirely due to sampling error","The null hypothesis H_0 is accepted"],"answer":1}],
 'rm_theory_9': [{"q":"Which statistical test is best suited for examining relationships between quantitative variables rather than comparing group differences?","options":["Independent t-test","ANOVA","Correlation analysis","Chi-squared test"],"answer":2},{"q":"What is the range of values for Pearson’s correlation coefficient (r)?","options":["0 to +1","-1 to +1","-∞ to +∞","-100 to +100"],"answer":1},{"q":"In a scatter plot, if the data points slope downward from left to right, this indicates:","options":["A positive correlation","No correlation","A non-linear relationship","A negative correlation"],"answer":3},{"q":"When r = 0, it implies that:","options":["There is no linear relationship between the two variables","There is a perfect negative relationship","There is a strong direct causation","Y increases as X increases"],"answer":0},{"q":"Which of the following is a primary assumption for using Pearson's correlation coefficient?","options":["Variables must be on a nominal scale","Data must contain significant outliers","Both variables follow normal distributions","Sample must be non-random"],"answer":2},{"q":"Unlike correlation coefficient, covariance is:","options":["Dimensionless and unit-free","Affected by the change in scale of variables","Standardized between -1 and +1","Immune to changes in measurement units"],"answer":1},{"q":"In linear regression represented by Y = a + bX, what does the parameter 'b' represent?","options":["The slope of the line","The Y-intercept","The sample size","The degree of freedom"],"answer":0},{"q":"What does the Y-intercept ('a') represent in a simple linear regression equation?","options":["The change in Y for each unit change in X","The correlation coefficient squared","The predicted value of Y when X is zero","The proportion of unexplained variance"],"answer":2},{"q":"What is the degrees of freedom (df) for calculating Pearson’s correlation coefficient (r) in a sample of n pairs?","options":["n - 1","n - 2","2n - 1","n / 2"],"answer":1},{"q":"When an increase in study hours leads to higher test scores, this is an example of:","options":["Negative correlation","Spurious correlation","Positive correlation","Curved association"],"answer":2},{"q":"A study finds a strong correlation between ice cream sales and drowning incidents due to summer temperature. This relationship is best classified as:","options":["Direct causation","Mediation","Moderation","Spurious association"],"answer":3},{"q":"In mediation analysis, the mediator variable (C) explains:","options":["\"When\" or \"for whom\" an effect occurs","The underlying mechanism (\"how\" or \"why\") X causes Y","The non-linear quadratic shape of data","The unit of scale change in linear regression"],"answer":1},{"q":"A moderator variable (M) answers which of the following clinical questions?","options":["\"How does the treatment cause the cure?\"","\"What is the biochemical mechanism of the drug?\"","\"For whom or under what conditions does the effect occur?\"","\"What is the exact correlation coefficient value?\""],"answer":2},{"q":"What type of regression is used when there are two or more independent variables predicting a single outcome?","options":["Simple linear regression","Multiple linear regression","Logistic regression with one predictor","Pearson correlation"],"answer":1},{"q":"What metric represents the proportion of variance in the dependent variable (Y) explained by the independent variable (X)?","options":["Slope (b)","Covariance","Coefficient of Determination (R^2)","P-value"],"answer":2},{"q":"How does a single extreme outlier affect Pearson’s correlation coefficient (r)?","options":["It has zero effect on r","It automatically turns r into zero","It can dramatically affect the value of r","It converts linear correlation to logistic regression"],"answer":2},{"q":"If all values of variable X are converted from centimeters to meters, the value of Pearson's r will:","options":["Decrease by 100 times","Remain unchanged","Change ive / Categorical data","Parametric data","Interval data"],"answer":1},{"q":"Continuity correction (Yates') is omitted in which type of Chi-square test?","options":["2 × 2 tables","r × c tables (larger than 2 × 2)","Tests comparing two proportions","One-tailed tests"],"answer":1},{"q":"What statistical test compares means between MORE than two groups with one continuous variable?","options":["Two-sample t-test","Chi-square test","F-test / ANOVA","Paired t-test"],"answer":2},{"q":"The critical Chi-square value for d.f. = 4 at α = 0.05 is:","options":["9.49","7.82","11.07","13.28"],"answer":0},{"q":"If the calculated Chi-square value falls in the acceptance region (P > 0.05), we conclude that:","options":["The factor has a strong significant effect","The observed difference is mainly due to chance/sampling variation","The null hypothesis (H₀) is rejected","The two variables are highly associated"],"answer":1}],

e of the steps in the 5 C's of statistical hypothesis testing?","options":["Creating the hypothesis","Calculating the test statistic","Controlling the population mean","Concluding based on findings"],"answer":2},{"q":"A researcher wants to test if a new drug lowers blood pressure below 130 mmHg. What is the correct alternative hypothesis?","options":["H₁: μ ≠ 130","H₁: μ > 130","H₁: μ < 130","H₁: μ = 130"],"answer":2},{"q":"If a study sets a 95% confidence level, what is the corresponding significance level (α)?","options":["0.01","0.05","0.10","0.50"],"answer":1},{"q":"Failing to reject the null hypothesis when it is actually false is called:","options":["Type I error","Type II error","Significance error","Power error"],"answer":1},{"q":"What is the mathematical definition of Statistical Power?","options":["1 − α","α + β","1 − β","β / α"],"answer":2},{"q":"In a two-sided test with α = 0.05, if the calculated Z-score is 1.33, what is the decision?","options":["Reject H₀","Fail to reject H₀","Accept H₁","Change to a one-sided test"],"answer":1}],

let activeModule='nt', currentQuiz=null, currentIndex=0, score=0, answered=false, wrongQuestions=[], lastWrongQuestions=[];
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setTheme(name){const allowed=['warm','cool','soft','powerful','modern','futuristic','nature','exclusive','popular','romantic','vintage','traditional','burgundy','sky','orange','midnight','slate','mint','sand','ice','coffee'];if(!allowed.includes(name))name='warm';document.documentElement.setAttribute('data-theme',name);localStorage.setItem('app_color_theme',name);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`setTheme('${name}')`));}
function toggleMode(){const dark=document.documentElement.getAttribute('data-mode')==='dark';if(dark){document.documentElement.removeAttribute('data-mode');document.getElementById('modeBtn').textContent='☀️ فاتح';localStorage.setItem('app_mode','light')}else{document.documentElement.setAttribute('data-mode','dark');document.getElementById('modeBtn').textContent='🌙 غامق';localStorage.setItem('app_mode','dark')}}
setTheme(localStorage.getItem('app_color_theme')||'warm');if(localStorage.getItem('app_mode')==='dark'){document.documentElement.setAttribute('data-mode','dark');document.getElementById('modeBtn').textContent='🌙 غامق'}
function renderNav(){const nav=document.getElementById('modulesNav');nav.innerHTML='';Object.keys(defaultModules).forEach(key=>{const m=defaultModules[key],b=document.createElement('button');b.className='module-tab '+(key===activeModule?'active':'');b.innerHTML=`${m.icon} ${escapeHTML(m.title)}`;b.onclick=()=>{activeModule=key;renderNav();renderModules()};nav.appendChild(b)})}
function renderModules(){const root=document.getElementById('modulesContainer');root.innerHTML='';const mod=defaultModules[activeModule];const title=document.createElement('h2');title.className='section-title';title.textContent=mod.icon+' '+mod.title;root.appendChild(title);
 mod.sections.forEach(sec=>{const sh=document.createElement('h3');sh.className='section-title';sh.textContent=sec.name;root.appendChild(sh);const grid=document.createElement('div');grid.className='subjects-grid';
 sec.subjects.forEach(sub=>{const card=document.createElement('section');card.className='subject-card';const head=document.createElement('div');head.className='subject-header';head.innerHTML=`<div class="subject-title">${escapeHTML(sub.name)}</div><span>📚 ${sub.lectures.length} محاضرات</span>`;card.appendChild(head);const list=document.createElement('div');list.className='lectures-list';
 sub.lectures.forEach((lec,i)=>{const key=`${sub.id}_${i}`,has=!!quizzes[key];const row=document.createElement('div');row.className='lecture-row';row.innerHTML=`<span class="lecture-name">${escapeHTML(lec)}</span><button class="btn lecture-open ${has?'':'secondary'}" ${has?'':'disabled'}>${has?'ابدأ الامتحان 📝':'الأسئلة قريباً'}</button>`;const btn=row.querySelector('button');if(has)btn.onclick=()=>startQuiz(key,lec);list.appendChild(row)});card.appendChild(list);grid.appendChild(card)});root.appendChild(grid)})
}
function startQuiz(key,title,questionSet=null,mode='full'){const all=quizzes[key]||[];currentQuiz={key,title,allQuestions:all,questions:questionSet||all,mode};currentIndex=0;score=0;answered=false;wrongQuestions=[];document.getElementById('libraryView').hidden=true;document.getElementById('quizView').hidden=false;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function renderQuestion(){const host=document.getElementById('quizView'),q=currentQuiz.questions[currentIndex];answered=false;host.innerHTML=`<div class="quiz-card"><div class="quiz-top"><div class="quiz-title">${escapeHTML(currentQuiz.title)}</div><div class="quiz-meta">السؤال ${currentIndex+1} من ${currentQuiz.questions.length}</div></div><div class="quiz-progress"><div class="quiz-progress-fill" style="width:${currentIndex/currentQuiz.questions.length*100}%"></div></div><div class="question-text">${currentIndex+1}. ${escapeHTML(q.q)}</div><div class="options">${q.options.map((o,i)=>`<button class="option" data-option="${i}"><span class="option-symbol">${['A','B','C','D'][i]}.</span><span>${escapeHTML(o)}</span><span class="option-symbol" aria-hidden="true"></span></button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="quiz-actions"><button class="btn secondary" onclick="backToLibrary()">رجوع للمحاضرات</button><button class="btn" id="nextBtn" disabled>${currentIndex===currentQuiz.questions.length-1?'عرض النتيجة':'السؤال التالي ←'}</button></div></div>`;
 host.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>chooseAnswer(Number(b.dataset.option))));document.getElementById('nextBtn').onclick=nextQuestion}
function chooseAnswer(choice){if(answered)return;answered=true;const q=currentQuiz.questions[currentIndex];if(choice!==q.answer)wrongQuestions.push(q);const buttons=document.querySelectorAll('.option');buttons.forEach((b,i)=>{b.disabled=true;const sym=b.querySelectorAll('.option-symbol')[1];if(i===q.answer){b.classList.add('correct');sym.textContent='✓'}if(i===choice&&i!==q.answer){b.classList.add('wrong');sym.textContent='✕'}});const fb=document.getElementById('feedback');if(choice===q.answer){score++;fb.className='feedback correct';fb.textContent='إجابة صحيحة! ✓'}else{fb.className='feedback wrong';fb.textContent='إجابة خاطئة ✕ — الإجابة الصحيحة: '+q.options[q.answer]}document.getElementById('nextBtn').disabled=false}
function nextQuestion(){if(!answered)return;if(currentIndex<currentQuiz.questions.length-1){currentIndex++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}else showResult()}
function showResult(){
 const total=currentQuiz.questions.length,pct=Math.round(score/total*100);
 const missed=[...new Map(wrongQuestions.map(q=>[q.q,q])).values()];
 lastWrongQuestions=missed.slice();
 const mistakes=missed.length?`<div class="section-title">❌ الأسئلة اللي أخطأت بيها (${missed.length})</div><div class="result-message">جرّب تحل الأسئلة مرة ثانية بدون ما تشوف الإجابات الصحيحة 💪</div>${missed.map((q,i)=>`<div class="card"><div style="font-weight:800;line-height:1.7">${i+1}. ${escapeHTML(q.q)}</div></div>`).join('')}`:`<div class="result-message">🎉 أحسنت! ما عندك أي إجابة خاطئة.</div>`;
 const wrongBtn=missed.length?`<button class="btn secondary" onclick="retryWrongQuestions()">إعادة الأسئلة الخاطئة 💪</button>`:'';
 document.getElementById('quizView').innerHTML=`<div class="quiz-card"><div class="quiz-title" style="text-align:center">${escapeHTML(currentQuiz.title)}</div><div class="result-score">${score} / ${total}</div><div class="result-message">درجتك ${pct}% ${pct>=80?'ممتاز! 🌟':pct>=60?'جيد، استمر بالمراجعة 💪':'راجع المحاضرة وحاول مرة ثانية 📚'}</div>${mistakes}<div class="quiz-actions" style="justify-content:center">${wrongBtn}<button class="btn secondary" onclick="startQuiz(currentQuiz.key,currentQuiz.title)">إعادة المحاضرة كاملة 🔁</button><button class="btn" onclick="backToLibrary()">الرجوع للمحاضرات 📚</button></div></div>`
}
function retryWrongQuestions(){if(!currentQuiz||!lastWrongQuestions.length)return;startQuiz(currentQuiz.key,currentQuiz.title,lastWrongQuestions.slice(),'wrong')}
function backToLibrary(){document.getElementById('quizView').hidden=true;document.getElementById('libraryView').hidden=false;currentQuiz=null;window.scrollTo({top:0,behavior:'smooth'})}
renderNav();renderModules();
</script>
